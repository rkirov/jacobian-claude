status:
  scope: >
    Implement Kevin Buzzard's v0.4 Jacobians API for compact Riemann surfaces — `genus`, the
    `Jacobian` variety with its 7 manifold/Lie-group instances, the Abel–Jacobi map `ofCurve` (+
    `_inj`/`_contMDiff`/`_self`), `pushforward`/`pullback` functoriality, `ContMDiff.degree`,
    `pushforward_pullback`, and the anti-hack headline `genus_eq_zero_iff_homeo` (genus 0 ⟺ X ≃ₜ S²) —
    building ALL the required Riemann-surface theory (Riemann–Roch, Serre duality, the residue theorem,
    period lattices, the Dolbeault/Čech machinery) from scratch, with ZERO reliance on future Mathlib.
    Conformance to the exact v0.4 signatures is machine-checked by `ChallengeConformance.lean` (exit 0).
  sorry_count: 10                       # declarations using `sorry`; 2 are DEAD/superseded (deg_div route, hodge_symmetry)
  sorry_in_definitions: 0               # all live sorries are in Prop-valued theorems / `Nonempty`/`∃` existence statements
  axioms:                               # 0 custom axioms; the full unproved surface is the `sorry`s
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
    - "sorryAx"                         # present on the still-gated deliverables only
  main_results:
    - declaration: "MeromorphicFunction.deg_div"
      file: "Jacobians/RiemannRoch.lean"
      sorry_count: 0                    # PROVEN this session — the residue theorem (Forster Cor. 4.25)
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: ""
      literature_dependencies: []
    - declaration: "ContMDiff.degree"
      file: "Jacobians/Discharge/Manifold/Degree.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: ""
      literature_dependencies: []
    - declaration: "genus_eq_zero_iff_homeo"
      file: "Jacobians/GenusSphereHeadline.lean"
      sorry_count: 5                    # GATED — distinct open classical inputs below (forward: RR/Serre tower; backward: de Rham)
      axioms: ["propext", "Classical.choice", "Quot.sound", "sorryAx"]
      comparator_config: ""
      literature_dependencies:          # currently `sorry` — the project's remaining goals (intended to be PROVEN, not assumed)
        - statement: "Finiteness of H¹(X, 𝒪_D) (Cartan–Serre); the RR/Serre keystone"
          source: "Forster, Lectures on Riemann Surfaces, §14"
        - statement: "Riemann–Roch / χ-additivity (cohomological form)"
          source: "Forster, §16"
        - statement: "Serre duality at D=0 (residue pairing perfectness): dim H¹(X,𝒪) = dim H⁰(X,Ω) = genus"
          source: "Forster, §17"
        - statement: "Holomorphic Poincaré lemma / monodromy (manifold de Rham) for the backward direction"
          source: "Forster, §10; de Rham"
    - declaration: "ofCurve_inj"
      file: "Jacobians.lean"
      sorry_count: 2
      axioms: ["propext", "Classical.choice", "Quot.sound", "sorryAx"]
      comparator_config: ""
      literature_dependencies:
        - statement: "Abel's theorem (two-point Abel–Jacobi image ≠ 0)"
          source: "Forster, §20 / Miranda, Ch. VIII"
        - statement: "Period lattice full-rank via a canonical 4g-gon dissection (surface classification / Radó)"
          source: "Forster, §§20–21; Springer pp. 139–141"

automation:
  methods:
    - method: "autonomous"              # agentic formalization: high-level human prompts; Claude Code drives end-to-end
      models: ["claude-opus-4-8", "claude-sonnet-4-x (earlier sessions)"]
      framework: "Claude Code"
      tool_setup: >
        Claude Code with the lean-lsp MCP server (goal/hover/loogle/local-search/multi-attempt) and
        background sub-agent orchestration (lean4:sorry-filler-deep for stubborn sorries, Explore for
        read-only fan-out). Soundness gate: every claimed close is independently kernel-verified via
        `#print axioms` (sorryAx must be absent) before being trusted — labels are never trusted; orphan
        modules are swept; each commit is `lake build`-green.
      cost:
        wall_time: "multi-session over several weeks (incl. long overnight autonomous runs)"
        spend_usd: "subscription-based usage, $100/month subscription."
        hardware: "single 4-core / ~8 GB laptop (+ swap); API-only model access"
      prompting_notes: >
        Steered with terse high-level directives ("finish the project, work upstream→downstream", "read
        the docs/book", "rethink the plan"). Discipline encoded in project memory: connect already-proven
        pieces bottom-up; prefer standard textbook proofs + standard Mathlib lemmas; verify every agent
        commit; flag (don't fake) false-as-stated statements.
  spend_usd: "subscription-based usage"
  notes: >
    34k lines of Lean (cloc; +19k of docstrings) across 171 files. The repo isolates each remaining classical theorem into a single named,
    non-vacuous `sorry` (a true statement, not open design). Two false-as-stated statements were caught and
    flagged (not faked) this session via the kernel-axiom discipline (`ChartCoverContinuousLeray` continuous-vs-
    holomorphic cochain mismatch; `exists_skyscraperLES` fixed-cover obstruction).

fidelity:
  divergences: >
    Deliberately PDE-FREE where Mathlib lacks foundations: the residue theorem uses the degree route
    (conservation of number) and Miranda §VIII.3's trace-to-ℙ¹ instead of Forster §17.1's manifold-Stokes
    ∬_X definition; Serre duality is re-pointed onto Forster §17's residue pairing instead of a Hodge-
    symmetry/Dolbeault-comparison route (no harmonic forms / elliptic regularity). Junk-free encodings
    replace naive ones: Filter.Germ (codiscreteWithin) for Čech 𝒪_D cochains, and a "limit-repair"
    `holoRepr` for meromorphic point-values (the raw `toFun` is only a germ representative). `Jacobian X`
    is genuinely universe-polymorphic (ULift of the concrete torus). NB: the above are PROOF-INTERNAL
    choices (vs. the textbook sources) — the v0.4 API *signatures* are matched VERBATIM
    (`ChallengeConformance.lean` restates each and discharges it by ours; compiles, exit 0; no documented
    discrepancies). Caveat: matching a signature ≠ a sorry-free proof — many such decls still carry `sorryAx`.

review:
  status: "self-assessed"
  reviewers: []
  notes: >
    Verification is by Lean's kernel: `#print axioms <decl>` on every claimed result (a `sorryAx`
    dependency marks a decl as still gated), plus the full-glob `lake build` (green, 8467 jobs) and the
    `ChallengeConformance.lean` machine-check that every v0.4 signature is inhabited verbatim. No external
    peer review. The remaining surface is the genuine mathematics (see `status.main_results`), not bookkeeping.

