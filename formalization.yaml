automation:
  methods:
    - method: "autonomous"              # agentic formalization: high-level human prompts; Claude Code drives end-to-end
      models: ["claude-fable-5 (endgame)", "claude-opus-4-8", "claude-sonnet-4-x (earlier sessions)"]
      framework: "Claude Code"
      tool_setup: >
        Claude Code with the lean-lsp MCP server (goal/hover/loogle/local-search/multi-attempt) and
        background sub-agent orchestration in parallel git worktrees, with books-first research passes
        (committed under docs/) deciding routes before builds. Soundness gate: every claimed close is
        independently kernel-verified via `#print axioms` (sorryAx must be absent) before being
        trusted — labels are never trusted; orphan modules are swept (scripts/dead_modules.py); each
        commit is `lake build`-green.
      cost:
        wall_time: "multi-session over ~8 weeks (2026-04 to 2026-06-11), incl. long overnight autonomous runs"
        spend_usd: "subscription-based usage, $100/month subscription"
        hardware: "single 4-core / ~8 GB laptop; API-only model access"
      prompting_notes: >
        Steered with terse high-level directives ("finish RR", "read the books to find the right
        path", "continue"). Discipline encoded in project memory: connect already-proven pieces
        bottom-up; prefer standard textbook proofs + standard Mathlib lemmas; verify every agent
        commit; flag (don't fake) false-as-stated statements; salvage-and-relaunch when agents die
        mid-run (incremental sorry-free commits as the handoff unit).
  spend_usd: "subscription-based usage"
  notes: >
    ~111k lines of Lean across 309 files, sorry-free, zero custom axioms. Multiple
    false-as-stated intermediate statements were caught and reformulated (not faked) via the
    kernel-axiom discipline over the project's lifetime. Several planned constructions were retired
    when research passes found cheaper book-faithful routes (most notably the 4g-gon cut surface,
    replaced by Forster's dissection-free §§19-21 analysis).

fidelity:
  divergences: >
    Deliberately PDE-free and integration-light where Mathlib lacks foundations: Riemann-Roch and
    Serre duality follow Miranda Ch. VI's Laurent-tail (adelic) route rather than Forster §17's
    manifold-Stokes residue functional; the residue theorem ∑Res = 0 is assembled from planar atoms
    (compact-support Stokes, annulus residue, holomorphic change of variables, a finite partition of
    unity) with no manifold 2-form integration; the monodromy theorem (holomorphic Poincaré lemma)
    uses discrete analytic continuation along chains with no integration at all; Abel's theorem and
    the period-lattice full rank follow Forster 19.10/20.7/21.4, dissection-free — no triangulation,
    no surface classification, no 4g-gon. Junk-free encodings replace naive ones: Filter.Germ
    (codiscreteWithin) for Čech 𝒪_D cochains, germ-quotient linear systems, and the value-wise
    `dF = η` formulation for primitives. `Jacobian X` is genuinely universe-polymorphic (ULift of
    the concrete torus). NB: these are PROOF-INTERNAL choices (vs. the textbook sources) — the v0.4
    API signatures are matched VERBATIM (ChallengeConformance.lean; compiles, exit 0; no documented
    discrepancies), as is the lean-eval leaderboard form (ChallengeLeaderboard.lean).

review:
  status: "self-assessed"
  reviewers: []
  notes: >
    Verification is by Lean's kernel: `#print axioms <decl>` on every result (all report
    [propext, Classical.choice, Quot.sound]), the full-glob `lake build` (green, ~8.6k jobs), the
    repo-wide zero-sorry sweep, and the two conformance files restating every challenge signature
    verbatim. No external peer review yet; the human director is not a subject expert (see the
    README disclaimer) — expert review is welcome.

alignment:
  namespace: "Jacobians (challenge API names genus / genus_eq_zero_iff_homeo / Jacobian.* live in root namespace)"
  statements:
    - source: "Buzzard v0.4: genus, Jacobian + 7 instances, ofCurve (+ _self/_contMDiff/_inj), pushforward/pullback (+ functoriality), ContMDiff.degree, pushforward_pullback"
      lean: "genus / Jacobian / ofCurve_inj / pushforward_pullback / ContMDiff.degree (and the rest)"
      module: "Jacobians/Genus.lean, Jacobians.lean, Jacobians/Discharge/Manifold/Degree.lean"
      status: "proved"
      note: "all axiom-clean [propext, Classical.choice, Quot.sound]; ChallengeConformance.lean restates each verbatim"
    - source: "Buzzard v0.4: genus_eq_zero_iff_homeo (the anti-hack headline)"
      lean: "genus_eq_zero_iff_homeo"
      module: "Jacobians/GenusSphereHeadline.lean"
      status: "proved"
      note: "forward via Riemann-Roch (single simple pole ⟹ degree-1 map ⟹ sphere); backward via the monodromy theorem (discrete analytic continuation)"
    - source: "Riemann-Roch (Forster 16.9 / Miranda VI.3.11), every genus"
      lean: "Jacobians.exists_riemannRoch_divisor"
      module: "Jacobians/RiemannRoch.lean, Jacobians/LaurentTail/"
      status: "proved"
      note: "Miranda Ch. VI Laurent-tail route: tail H¹ + RR-I + Serre duality h¹(D) = l(K−D) in the meromorphic pair frame"
    - source: "The residue theorem ∑Res = 0 (Forster 10.20/10.21), genus-free"
      lean: "Jacobians.Dolbeault.residueSum_pairForm_eq_zero_unconditional"
      module: "Jacobians/Dolbeault/ResidueTheoremStokes.lean"
      status: "proved"
      note: "planar Stokes + annulus atoms + PoU ledger; no manifold 2-form integration; deg_div also via the degree route"
    - source: "Finiteness of H¹(X, 𝒪_D) (Forster §14) + cohomological RR (§16) + Čech↔Dolbeault comparison (§15.14)"
      lean: "finiteDimensional_cechH1 / cohomological_riemannRoch / comparison_linearEquiv"
      module: "Jacobians/Dolbeault/"
      status: "proved"
      note: "the supporting tower; h¹_Čech(0) = genus closed for the Abel engine (CechH1Genus.lean)"
    - source: "Abel's theorem, sufficiency (Forster 19.10 / 20.7(a)) — abelJacobi_twoPoint_ne_zero ⇒ ofCurve_inj"
      lean: "Jacobians.abelJacobi_twoPoint_ne_zero"
      module: "Jacobians/Abel.lean, Jacobians/AbelFinal.lean (engine: AbelChains/WeakSolutions/PieceSolution/DbarKill/EngineSigma/EngineMeromorphic)"
      status: "proved"
      note: "dissection-free: weak solutions + the ∂̄-solvability criterion; no polygon, no triangulation"
    - source: "Period lattice full rank (Forster 21.4) — the Jacobian torus structure"
      lean: "Jacobians.exists_periodLattice_realBasis"
      module: "Jacobians/PeriodLattice.lean, PeriodLatticeBasis/Discrete/Nondegenerate.lean, JacobiLocalMap.lean"
      status: "proved"
      note: "dissection-free; the formerly-planned exists_cutSurface obligation was retired (CutSurfaceRelations archived hypothesis-conditional)"
    - source: "Holomorphic Poincaré lemma / monodromy — backward genus_eq_zero_iff_homeo"
      lean: "Jacobians.hasHolomorphicPrimitives"
      module: "Jacobians/HolomorphicPrimitives.lean (+ Local/Chain/Monodromy)"
      status: "proved"
      note: "discrete analytic continuation along primitive chains; chain-independence + homotopy invariance; no integration"

