name: Docs

on:
  workflow_dispatch:   # push trigger restored once the literate conversion lands

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Get Mathlib cache + build library
        run: |
          lake exe cache get
          lake build

      - name: Generate + build Verso site
        run: |
          python3 scripts/unit_design.py
          python3 scripts/generate_verso_site.py
          cd site
          lake exe jacobianssite

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site
          cp -r docs/* _site/                           # units.html, proposal, reviewer docs
          cp -r site/_out/html-multi _site/exposition
          printf '<meta http-equiv="refresh" content="0; url=exposition/">' > _site/index.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
