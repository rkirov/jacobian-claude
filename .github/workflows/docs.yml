name: Docs

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # lean-action installs elan, reads lean-toolchain, caches .lake, fetches the
      # Mathlib cache. Build is deferred to the literate facet below.
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false

      - name: Build literate site
        id: literate
        run: echo "path=$(lake query :literateHtml)" >> "$GITHUB_OUTPUT"

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site
          cp -r "${{ steps.literate.outputs.path }}"/* _site/
          mkdir -p _site/docs && cp -r docs/* _site/docs/   # units.html graph, reviewer docs
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
