name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sorry count (informational)
        run: python3 scripts/check_sorries.py  # informational; not a gate

      - name: Unit DAG strict-deps gate
        run: python3 scripts/unit_design.py  # fails on cycles, unassigned modules, undeclared unit edges

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

      - name: Zero-warning gate
        run: |
          lake build 2>&1 | tee /tmp/build.log | tail -2   # cache replay after lean-action
          ! grep -E '^(warning|error)' /tmp/build.log

      - name: Axiom hygiene check
        run: lake env lean AxiomCheck.lean

      - name: Comparator statement replica
        run: python3 scripts/comparator_replica.py  # lean-eval statement check, local form
