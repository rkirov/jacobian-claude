# Verso Manual-genre exposition (sources generated by scripts/generate_verso_site.py).
# Shares the root package directory so the verso package built for the literate facet
# is reused; deliberately does NOT depend on the Jacobians library (statements are
# extracted textually — importing the library would pull Mathlib into the native
# link closure of the executable).
name = "jacobianssite"
reservoir = false
version = "0.1.0"
defaultTargets = ["jacobianssite"]
packagesDir = "../.lake/packages"

[[require]]
scope = "leanprover"
name = "verso"
rev = "v4.30.0-rc1"

[[lean_lib]]
name = "Site"

[[lean_exe]]
name = "jacobianssite"
root = "Main"
